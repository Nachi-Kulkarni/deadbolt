<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f2ec; --fg:#1d1c19; --mute:#6c6a62; --line:#d6d3c8; --accent:#a4361f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17171a; --fg:#ececea; --mute:#9a9a94; --line:#33333a; --accent:#e0735a; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; padding:32px 20px; }
  h1 { font-size:32px; margin:0 0 4px; letter-spacing:-.02em; }
  p { margin:8px 0; }
  .mute { color:var(--mute); }
  .url { overflow-wrap:anywhere; color:var(--mute); font-size:14px; }
  blockquote { margin:24px 0; padding-left:14px; border-left:3px solid var(--accent); }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  textarea { width:100%; box-sizing:border-box; min-height:90px; font:14px ui-monospace, monospace; padding:8px; background:transparent; color:inherit; border:1px solid var(--line); border-radius:6px; }
  #challenge { user-select:none; -webkit-user-select:none; font:14px ui-monospace, monospace; padding:10px; border:1px dashed var(--line); border-radius:6px; overflow-wrap:anywhere; }
  .err { color:var(--accent); }
  section { margin-top:20px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Blocked</h1>
  <p class="mute" id="reason"></p>
  <p class="url" id="url"></p>
  <blockquote id="quote"></blockquote>
  <section id="actions"></section>
</main>
<script src="block.js"></script>
</body>
</html>
